async function laden(){if(!STATIC){S=await(await fetch('/api/stand')).json()}zeichne()}
async function post(u,d){if(STATIC){toast('Vorschau: Nichts wird gespeichert.');return null}const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok){toast('Hat nicht geklappt.');return null}return r.json()}
function datum(d){const t=new Date(d+'T12:00');return t.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}
function st(s){const x=STATUS[s]||STATUS.idee;return `<span class="status" style="--f:${x[1]};--rd:${x[2]}">${x[0]}</span>`}
function leiste(){const p=S.posts,w=p.filter(x=>x.status==='freigabe').length,d=p.filter(x=>x.status==='skript').length,o=S.offen.filter(x=>!x.erledigt).length;
 const K=[['pass','freigabe',w,'warten auf Freigabe','#ff4005'],['pass','skript',d,'brauchen einen Dreh','#3b8bff'],['eroeffnung','',S.staedte.length,'Eröffnungen vorbereitet','#4f0423'],['offen','',o,'Fragen an Mmaah','#e0b800'],['zahlen','',S.tiktok.tage_seit_letztem,'Tage ohne TikTok','#ff4005',1]];
 $('#leiste').innerHTML=K.map(([t,f,n,l,c,warn])=>`<button class="kz${warn?' warn':''}" onclick="${f?`filt='${f}';`:''}geh('${t}')"><span><i class="dot" style="--d:${c}"></i>${l}</span><b>${zahl(n)}</b></button>`).join('');
 $('#nav').innerHTML=`<div class="innen"><div class="seg">${TAB.map(([k,l])=>{const n=k==='pass'?w:k==='offen'?o:0;return `<button aria-current="${tab===k?'page':'false'}" onclick="geh('${k}')">${l}${n?`<i>${n}</i>`:''}</button>`}).join('')}</div></div>`}
function geh(k){tab=k;history.replaceState(null,'','#'+k);zeichne();const n=$('#nav');scrollTo({top:innerWidth>=900&&scrollY>n.offsetTop?n.offsetTop:0})}
function medien(p){const a=p.asset;if(a&&/\.mp4$/.test(a))return`<div class="medien"><video src="${pfad(a)}#t=1.6" controls playsinline preload="metadata"></video></div>`;
 if(a)return`<div class="medien"><img src="${pfad(a)}" alt="Motiv ${esc(p.hook)}" loading="lazy"></div>`;
 if(p.dreh)return`<div class="medien"><div class="leer"><b><i class="dot" style="--d:#3b8bff"></i>Dreh fehlt</b><ul>${p.dreh.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
 return`<div class="medien"><div class="leer"><b><i class="dot" style="--d:#d4a106"></i>Wird gebaut</b>Sobald die Daten da sind.</div></div>`}
function bon(p,i){const f=p.freigabe;
 return `<article class="bon" style="--i:${Math.min(i,14)}" id="b-${p.id}">${medien(p)}<div class="kb">
 <div class="bonkopf mono"><span>Beitrag ${esc(p.id)}</span><span>${datum(p.datum)} · ${esc(p.zeit)}</span></div>
 <div class="tags"><span class="serie">${esc(p.serie)}</span><span class="mono">${esc(p.format)}</span>${st(p.status)}</div>
 <h3 class="hook">${esc(p.hook)}</h3>
 ${p.status==='freigegeben'?`<p class="ok"><i class="dot" style="--d:#1f9d55"></i>Freigegeben von ${esc(f?.wer)}${f?.wann?` · ${esc(f.wann)}`:''}</p>`:''}
 ${p.status==='ueberarbeiten'?`<p class="ok neu"><i class="dot" style="--d:#3b8bff"></i>Zurück an den Agenten${p.kommentar?.wer?` · ${esc(p.kommentar.wer)}`:''}</p>`:''}
 <p class="cap">${esc(p.caption)}</p>
 ${p.hinweis?`<p class="hint">${esc(p.hinweis)}</p>`:''}
 ${p.kommentar?`<p class="hint">Kommentar: ${esc(p.kommentar.text)}</p>`:''}
 <p class="alt">Store: ${esc(p.store)} · Ziel: ${esc(p.ziel)}</p>
 <details><summary>Skript und andere Hooks</summary><ul style="margin:8px 0;padding-left:18px;font-size:13px;color:var(--ink2)">${(p.skript||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="alt">Getestete Alternativen: ${(p.hooks_alt||[]).map(esc).join(' / ')}</p></details>
 ${aktionen(p)}</div></article>`}
function aktionen(p){if(p.status==='freigabe')return`<div class="knopf"><button class="btn ja" onclick="frei('${p.id}')">Freigeben</button><button class="btn nein" onclick="ablehn('${p.id}')">Ändern</button></div>`;
 if(p.status==='freigegeben'||p.status==='ueberarbeiten')return`<div class="knopf"><button class="btn nein" onclick="zurueck('${p.id}')">Zurücknehmen</button></div>`;return''}
function wechsel(p,n){Object.assign(S.posts.find(x=>x.id===p),n);zeichne()}
async function frei(id){const w=name();if(!w){toast('Bitte zuerst oben deinen Namen eintragen.');$('#wer')?.focus();return}
 const r=await post('/api/post',{id,aktion:'freigeben',wer:w});wechsel(id,r||{status:'freigegeben',freigabe:{wer:w,wann:'Vorschau'}});toast('Freigegeben. Der Agent plant das ein.')}
async function ablehn(id){const w=name();if(!w){toast('Bitte zuerst oben deinen Namen eintragen.');$('#wer')?.focus();return}const t=prompt('Was soll anders werden?');if(t===null)return;
 const r=await post('/api/post',{id,aktion:'ablehnen',wer:w,text:t});wechsel(id,r||{status:'ueberarbeiten',kommentar:{wer:w,text:t}})}
async function zurueck(id){const r=await post('/api/post',{id,aktion:'zurueck'});wechsel(id,r||{status:'freigabe',freigabe:null})}
function vPass(){const P=S.posts,zaehl=k=>P.filter(k).length;const F=[['freigabe','Freigabe'],['skript','Dreh fehlt'],['wartet','Wartet auf Daten'],['freigegeben','Freigegeben'],['ueberarbeiten','Überarbeiten'],['alle','Alle']];
 const L=P.filter(x=>filt==='alle'||x.status===filt);
 return `<div class="h"><div><h2>Der Pass</h2><p class="hin">Jeder Beitrag wartet hier auf dein Ja. Du gibst frei, der Agent plant ein. Die erste Runde ist ein Vorschlag vom 06.11.2026 für 09.11. bis 08.12.2026, geprüft mit dem Prüf Werkzeug, noch von niemandem bei Mmaah gesehen.</p></div></div>
 <label class="wer">Wer gibt frei? <input id="wer" value="${esc(name())}" placeholder="Dein Name" oninput="localStorage.setItem('mm-wer',this.value)"></label>
 <div class="chips">${F.map(([k,l])=>`<button class="chip" aria-pressed="${filt===k}" onclick="filt='${k}';zeichne()">${l}<small>${k==='alle'?P.length:zaehl(x=>x.status===k)}</small></button>`).join('')}</div>
 <div class="bons">${L.map(bon).join('')||'<p class="hin">Nichts in dieser Spalte.</p>'}</div>`}
function vPlan(){const W={};for(const p of S.posts){const d=new Date(p.datum+'T12:00');const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));const k=m.toISOString().slice(0,10);(W[k]=W[k]||{})[((d.getDay()+6)%7)]=p}
 const T=['Mo','Di','Mi','Do','Fr','Sa','So'];
 return `<div class="h"><div><h2>Der Plan</h2><p class="hin">Lustig, Laden, Essen, jede Woche. Zeiten sind Hypothesen aus der Abendspitze, nach 8 Wochen wird nachgemessen. Antippen öffnet den Beitrag.</p></div></div>`+Object.entries(W).map(([k,t])=>`<section class="woche"><h3>Woche ab ${datum(k)}</h3><div class="tage">${T.map((_,i)=>{const p=t[i];if(!p)return window.innerWidth>820?'<div></div>':'';return`<button class="tagb" onclick="offne('${p.id}')"><small>${datum(p.datum)} · ${esc(p.zeit)}<br>${esc(p.serie)}</small><b>${esc(p.hook)}</b>${st(p.status)}</button>`}).join('')}</div></section>`).join('')}
function offne(id){const p=S.posts.find(x=>x.id===id);$('#dlgi').innerHTML=`<div style="padding:12px">${bon(p,0)}</div>`;dlg.showModal()}
function zoom(u){$('#dlgi').innerHTML=`<img src="${u}" alt="Plakat groß">`;dlg.showModal()}
function vEroeff(){const s=S.staedte[stadt];const ph={};for(const a of s.aufgaben)(ph[a.phase]=ph[a.phase]||[]).push(a);const fertig=s.aufgaben.filter(a=>a.status==='erledigt').length;
 return `<div class="chips">${S.staedte.map((x,i)=>`<button class="chip" aria-pressed="${i===stadt}" onclick="stadt=${i};zeichne()">${esc(x.stadt)}</button>`).join('')}</div>
 <section class="stadt"><h2>${esc(s.stadt)}</h2><p>${esc(s.adresse)}, ${esc(s.plz)}. ${s.datum?'Termin '+datum(s.datum):'<span class="warn">Termin fehlt.</span> Website sagt: '+esc(s.status_website||'')}</p><p>Stadt Witz: ${esc(s.witz)}</p><p class="mono" style="margin-top:14px">${fertig} von ${s.aufgaben.length} Aufgaben erledigt</p><div class="fort"><i style="width:${100*fertig/Math.max(1,s.aufgaben.length)}%"></i></div></section>
 ${(s.warnungen||[]).map(w=>`<p class="meldung">${esc(w)}</p>`).join('')}${s.anreiz_bestaetigt?'':'<p class="meldung">Anreiz noch nicht bestätigt. Plakat E7 bleibt Entwurf.</p>'}
 <h3 class="zw">Plakate A2</h3><div class="wand">${s.plakate.map(p=>`<button onclick="zoom('${pfad(p)}')" aria-label="Plakat groß zeigen"><img src="${pfad(p)}" alt="${esc(p.split('/').pop())}" loading="lazy"></button>`).join('')}</div>
 <div class="spalten"><div><h3 class="zw">Reel und Social</h3>${s.reels.map(r=>`<video src="${pfad(r)}#t=1.6" controls playsinline preload="metadata"></video>`).join('')}
 <div class="wand mini4" style="grid-template-columns:repeat(4,1fr);gap:6px">${s.social.map(p=>`<button onclick="zoom('${pfad(p)}')" aria-label="Motiv groß zeigen"><img src="${pfad(p)}" alt="" loading="lazy"></button>`).join('')}</div>
 <div class="reihe">${s.pdf.map(p=>`<a href="${pfad(p)}" target="_blank" rel="noopener">${esc(p.split('/').pop().match(/E\d/)?.[0]||'PDF')} PDF</a>`).join('')}</div>${s.creator?`<p class="hin">Creator in der Datenbank: ${s.creator.gesamt}, davon Food und Gastro ${s.creator.food}.${s.creator.food<15?' Zu wenig, Recherche in der Stadt nötig.':''}</p>`:''}</div>
 <div><h3 class="zw">Fahrplan, ${s.datum?'mit Kalendertagen':'relativ zu T'}</h3>${Object.entries(ph).map(([n,l])=>`<div class="ph">${esc(n)}</div><ul class="aufg">${l.map(a=>`<li class="${a.status==='erledigt'?'fertig':''}"><input type="checkbox" ${a.status==='erledigt'?'checked':''} aria-label="Erledigt" onchange="hak('${a.id}',this.checked)"><div><p>${esc(a.aufgabe)}</p><span class="art ${a.art}">${a.art==='agent'?'Agent':a.art==='mensch'?'Mensch':'Freigabe'}</span><span class="mono">${esc(a.wann)}${a.ueberfaellig?' · überfällig':''}${a.mensch?' · '+esc(a.mensch):''}</span></div></li>`).join('')}</ul>`).join('')}</div></div>`}
async function hak(id,e){const r=await post('/api/aufgabe',{id,erledigt:e,wer:name()});for(const s of S.staedte){const a=s.aufgaben.find(x=>x.id===id);if(a)a.status=e?'erledigt':'offen'}if(r||STATIC)zeichne()}
function vbars(L){const m=Math.max(...L.map(x=>x.w));return`<div class="vbars" role="img" aria-label="Balken">${L.map(x=>`<div tabindex="0" class="${x.an?'an':''}" style="height:${100*x.w/m}%" data-tip="${esc(x.tip)}">${x.lab?`<u>${esc(x.lab)}</u>`:''}</div>`).join('')}</div><div class="xachse">${L.map(x=>`<span>${esc(x.x)}</span>`).join('')}</div>`}
function vZahlen(){const t=S.tiktok;const K=S.kasse;
 let h=`<div class="h"><div><h2>Zahlen</h2><p class="hin">Öffentliche Zahlen TikTok, Abruf ${esc(t.abruf)}. Instagram Insights fehlen, Zugang nötig.</p></div></div><div class="kz3"><div><b>${zahl(t.median_views)}</b><span>Median Views je Video, ${t.videos} Videos</span></div><div><b>${t.top10_anteil_pct} %</b><span>aller Views aus den 10 besten</span></div><div><b style="color:var(--o)">${t.tage_seit_letztem}</b><span>Tage seit dem letzten Post</span></div></div>`;
 if(!K)return h+'<div class="tafel"><h3>Kassenzahlen bleiben lokal</h3><p>Auswertung je Wochentag, Stunde, Kanal und Store liegt nur auf dem Agent Rechner.</p></div>';
 const W=Object.entries(K.woche),mo=K.woche.Mo.je_tag,so=K.woche.So.je_tag;const St=Object.entries(K.stunden).filter(([a])=>+a>=11&&+a<=22);const ab=['17','18','19','20'].reduce((s,x)=>s+(K.stunden[x]||0),0);
 const kg=Object.entries(K.kanal_gruppen).sort((a,b)=>b[1]-a[1]);const pot=K.stores['Potsdam Bahnhofsviertel']?.wochen_tagesschnitt||[];
 h+=`<p class="meldung">Vertraulich. Kasse ${esc(K.kennung)}: 21 Standorte, nur Winterquartal, neuere Stores fehlen. Nie in Posts oder online.</p><div class="grid2" style="margin-top:14px">
 <section class="tafel"><h3>Montag macht ${Math.round(100*(1-mo/so))} % weniger als Sonntag</h3><p>Umsatz netto je Store und Tag, in Euro</p>${vbars(W.map(([k,v],i)=>({x:k,w:v.je_tag,an:i<3,lab:(i===0||i===6)?zahl(v.je_tag):'',tip:`${k}: ${zahl(v.je_tag)} €, ${v.bons} Bons, Bon ${v.bon} €`})))}</section>
 <section class="tafel"><h3>${Math.round(ab)} % vom Umsatz zwischen 17 und 21 Uhr</h3><p>Anteil am Umsatz je Stunde, in Prozent</p>${vbars(St.map(([k,v])=>({x:k,w:v,an:+k>=17&&+k<=20,lab:k==='18'?v+' %':'',tip:`${k} Uhr: ${v} %`})))}</section>
 <section class="tafel"><h3>Die App macht ${K.kanal_gruppen['Mobile App']} % vom Umsatz</h3><p>Anteil je Kanal in Prozent. Was OA Take-Away ist, muss Mmaah klären.</p>${kg.map(([k,v])=>`<div class="hbar ${k==='Mobile App'?'an':''}"><span>${esc(k)}</span><span><i style="width:${Math.max(.6,v/kg[0][1]*100)}%"></i></span><b>${v}</b></div>`).join('')}</section>
 <section class="tafel"><h3>Potsdam fällt von Woche 2 bis 8 um ${pot[1]?Math.round(100*(1-pot[7]/pot[1])):0} %</h3><p>Tagesumsatz im Schnitt je Woche nach Eröffnung am 31.01.2026, in Euro</p>${vbars(pot.map((v,i)=>({x:'W'+(i+1),w:v,an:i===1||i===7,lab:(i===1||i===7)?zahl(v):'',tip:`Woche ${i+1}: ${zahl(v)} € je Tag`})))}</section></div>
 <h3 class="zw" style="margin-top:28px">Stores</h3><div class="tafel scroll"><table class="tab"><thead><tr><th>Store</th><th>€ je Tag</th><th class="r">Bon €</th><th class="r">Rabatt %</th><th>Schwach</th><th>Stark</th><th class="r">Spanne %</th></tr></thead><tbody>${Object.entries(K.stores).sort((a,b)=>b[1].je_tag-a[1].je_tag).map(([k,v])=>`<tr><td>${esc(k)}</td><td><span class="mini" style="width:${v.je_tag/40}px"></span><span class="mono">${zahl(v.je_tag)}</span></td><td class="r">${v.bon}</td><td class="r">${v.rabatt_pct}</td><td>${esc((v.schwach||[]).join(', '))}</td><td>${esc(v.stark)}</td><td class="r">${v.spanne_pct??''}</td></tr>`).join('')}</tbody></table></div>`;return h}
function vOffen(){const O=S.offen,g={};for(const x of O)(g[x.gruppe]=g[x.gruppe]||[]).push(x);const f=O.filter(x=>x.erledigt).length;
 return `<div class="h"><div><h2>Was der Agent von Mmaah braucht</h2><p class="hin">${f} von ${O.length} geklärt. Der Agent rät hier nicht, er wartet.</p></div></div><div class="fort" style="margin:0 0 6px"><i style="width:${100*f/O.length}%"></i></div>`+Object.entries(g).map(([n,l])=>`<div class="grp">${esc(n)}<span class="mono">${l.filter(x=>!x.erledigt).length} offen</span></div><div class="liste">${l.map(x=>`<label class="frage"><input type="checkbox" ${x.erledigt?'checked':''} onchange="offenHak('${x.id}',this.checked)"><div><p>${esc(x.frage)}</p><small>${esc(x.warum)} Zuständig: ${esc(x.wer)}.</small></div></label>`).join('')}</div>`).join('')}
async function offenHak(id,e){await post('/api/offen',{id,erledigt:e});S.offen.find(x=>x.id===id).erledigt=e;zeichne()}
function zeichne(){leiste();const v={pass:vPass,plan:vPlan,eroeffnung:vEroeff,zahlen:vZahlen,offen:vOffen}[tab];$('#m').innerHTML=v()}
const tip=$('#tip');document.addEventListener('pointermove',e=>{const t=e.target.closest?.('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(innerWidth-90,Math.max(90,e.clientX))+'px';tip.style.top=e.clientY+'px'}else tip.style.display='none'});
document.addEventListener('focusin',e=>{const t=e.target.closest?.('[data-tip]');if(t){const r=t.getBoundingClientRect();tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(innerWidth-90,Math.max(90,r.left+r.width/2))+'px';tip.style.top=r.top+'px'}});
document.addEventListener('focusout',()=>tip.style.display='none');
if(!STATIC&&window.top===window){const c=new AbortController();fetch('/api/katalog',{signal:c.signal}).then(r=>{if(r.ok)$('#zuIntern').hidden=false;c.abort()}).catch(()=>{})} // Link nur dort, wo der Intern Bereich auch läuft
if(STATIC)$('#vorschau').innerHTML='<div class="vorschau">Vorschau ohne Kassenzahlen. Freigaben werden hier nicht gespeichert.</div>';
laden();
</script></body></html>
